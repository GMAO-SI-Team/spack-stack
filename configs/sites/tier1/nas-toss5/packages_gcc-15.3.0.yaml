packages:
  all:
    require:
    - any_of: ['%gcc@=15.3.0']
      when: '%gcc'
  mpi:
    buildable: false
    require:
    - "cray-mpich@8.1.33"
  gcc:
    buildable: false
    externals:
    - spec: gcc@15.3.0 languages:='c,c++,fortran'
      prefix: /nobackup/gmao_SIteam/gcc/gcc-15.3.0-TOSS5
      modules:
      - cray-libpals/1.7.1
      - cray-pals/1.7.1
      - craype-x86-turin
      - craype-network-ofi
      - cray-dsmml/0.3.1
      - PrgEnv-gnu/8.6.0
      - comp-gcc/15.3.0
      extra_attributes:
        compilers:
          c: /nobackup/gmao_SIteam/gcc/gcc-15.3.0-TOSS5/bin/gcc
          cxx: /nobackup/gmao_SIteam/gcc/gcc-15.3.0-TOSS5/bin/g++
          fortran: /nobackup/gmao_SIteam/gcc/gcc-15.3.0-TOSS5/bin/gfortran
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@8.1.33
      prefix: /opt/cray/pe/mpich/8.1.33/ofi/gnu/11.2
      modules:
      - cray-libpals/1.7.1
      - cray-pals/1.7.1
      - craype-x86-turin
      - craype-network-ofi
      - cray-dsmml/0.3.1
      - cray-mpich/8.1.33
      - mpi/mpich-gfortran
      extra_attributes:
        environment:
          set:
            MPICH_CC: gcc
            MPICH_CXX: g++
            MPICH_FC: gfortran
            CC: gcc
            CXX: g++
            FC: gfortran

  intel-oneapi-mkl:
    buildable: false
    externals:
    - spec: intel-oneapi-mkl@2024.2
      prefix: /nasa/intel/oneapi-test

  # Testing shows we now need to pass in -lm for GCC
  p4est:
    require:
    - 'ldflags="-lm"'
