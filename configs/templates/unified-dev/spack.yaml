# Template for grand, unified environment
#
spack:
  concretizer:
    unify: when_possible

  view: false
  include: []

  specs:
  # ai-env brings in py-torch (expensive); it is not included here. GMAO's
  # util/gmao/batch_install.sh adds it to new environments with --with-ai.
  - dev-utils-env
  - ewok-env
  - geos-gcm-env@11.10.0 ~debug +cdo +fms ^esmf@=9.0.0b18
  - geos-gcm-env@12.1.0  ~debug +cdo +fms ^esmf@=9.0.0b18
  - global-workflow-env   ^esmf@=8.8.0 ^crtm@=3.1.5

  - gmao-swell-env                     ^crtm@=3.1.5
  - gsi-env                            ^crtm@=3.1.5
  - jedi-fv3-env
  - jedi-geos-env         ^esmf@=9.0.0b18
  - jedi-mpas-env
  - jedi-neptune-env      ^esmf@=9.0.0b18
  - jedi-ufs-env          ^esmf@=8.8.0
  - neptune-env           ^esmf@=9.0.0b18
  - neptune-python-env    ^esmf@=9.0.0b18
  - soca-env
  - ufs-srw-app-env       ^esmf@=8.8.0 ^crtm@=3.1.5
  - ufs-weather-model-env ^esmf@=8.8.0 ^crtm@=3.1.5

  # Mapl with specific esmf tags (list all to avoid duplicate packages)
  - mapl@2.53.4 ^esmf@8.8.0

  # Various esmf tags (list all to avoid duplicate packages)
  - esmf@=8.8.0
  - esmf@=9.0.0b18

  # Various fms builds
  - fms +gfs_phys constants=GFS
  - fms ~gfs_phys constants=GEOS

  # MADIS for WCOSS2 decoders.
  - madis@4.5

  packages:
    # Turn on python variant for esmf
    esmf:
      require:
      - +python
    # Avoid duplicate builds of parallelio +pnetcdf and ~pnetcdf
    parallelio:
      require:
      - +pnetcdf
